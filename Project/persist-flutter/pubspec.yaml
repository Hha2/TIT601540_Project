name: persist_flutter
description: "Persist - Personal Productivity & Habit Tracking App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  provider: ^6.1.2
  fl_chart: ^0.70.2
  shared_preferences: ^2.3.4
  image_picker: ^1.1.2
  http: ^1.2.2
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - "assets/COLOR-PALLATE/"
    - "assets/LOGO-&-LOADING/"
    - "assets/UI-PAGES/"
